<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4eb">
  <title>鹈鹕的海边骑行 · Pelican Ride</title>
  <style>
    :root { color-scheme: light; --paper: #f7f4eb; --ink: #254c50; --muted: #708381; --accent: #ed794c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Avenir Next", "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    main { width: min(1220px, 100%); margin: auto; padding: 34px 44px 25px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 37px; height: 37px; }
    .eyebrow { margin: 0 0 5px; font-size: 10px; letter-spacing: .24em; font-weight: 650; }
    h1 { margin: 0; font-size: 19px; letter-spacing: .12em; font-weight: 600; }
    .edition { font-size: 10px; letter-spacing: .18em; color: var(--muted); text-align: right; line-height: 1.8; }
    .artwork { position: relative; margin: 8px -20px 0; }
    #scene { width: 100%; height: auto; display: block; overflow: visible; }
    .caption { display: flex; align-items: center; justify-content: space-between; margin: -6px 0 25px; }
    .caption p { margin: 0; font-size: 13px; letter-spacing: .1em; color: var(--muted); }
    .caption span { font-family: Georgia, serif; font-style: italic; font-size: 17px; color: var(--ink); }
    .controls { border-top: 1px solid #254c5025; padding-top: 19px; display: flex; align-items: center; gap: 24px; }
    .play-button { display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 112px; height: 45px; padding: 0 20px; border: 0; border-radius: 30px; background: var(--ink); color: #fffdf5; cursor: pointer; }
    .play-button:hover { background: #35656a; }
    .play-button svg { width: 14px; height: 14px; }
    .play-button span { font-size: 12px; letter-spacing: .08em; }
    .speed-control { display: flex; align-items: center; gap: 12px; }
    .speed-control label { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
    input[type="range"] { width: 118px; height: 24px; margin: 0; accent-color: var(--ink); cursor: pointer; }
    output { width: 35px; font-size: 12px; font-variant-numeric: tabular-nums; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: .14em; color: var(--muted); }
    .status-dot { width: 6px; height: 6px; background: #6d9184; border-radius: 50%; }
    .status.paused .status-dot { background: var(--accent); }
    .key-hint { color: #8a9690; font-size: 10px; letter-spacing: .04em; }
    @media (min-width: 1500px) { main { padding-top: 45px; } }
    @media (max-width: 650px) {
      main { padding: 25px 21px; }
      h1 { font-size: 16px; }
      .edition { font-size: 8px; }
      .brand-mark { width: 30px; height: 30px; }
      .artwork { margin: 28px -14px 22px; }
      #scene { aspect-ratio: 1.22; object-fit: contain; }
      .caption { margin-bottom: 24px; gap: 10px; }
      .caption p { font-size: 11px; letter-spacing: .02em; }
      .caption span { font-size: 14px; }
      .controls { flex-wrap: wrap; gap: 15px; }
      .play-button { min-width: 100px; padding: 0 15px; }
      .speed-control { margin-left: auto; gap: 9px; }
      input[type="range"] { width: 90px; }
      .status { margin-left: 0; }
      .key-hint { margin-left: auto; }
    }
    @media (max-width: 370px) { .edition { display: none; } .speed-control label { display: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.2"/>
          <path d="M9 26c4-5 7 5 11 0s7 5 11 0M13 20c2-4 6-6 10-5l8 3-8 2c-1 4-6 5-10 0Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="22" cy="16" r="1" fill="currentColor"/>
        </svg>
        <div><p class="eyebrow">THE PELICAN RIDE</p><h1>鹈鹕的海边骑行</h1></div>
      </div>
      <div class="edition">A LITTLE LOOP OF JOY<br>NO. 01 / COASTAL CRUISE</div>
    </header>

    <figure class="artwork" aria-label="一只系橙色围巾的白色鹈鹕骑着绿色自行车，在海岸边循环骑行。">
      <svg id="scene" viewBox="0 0 1200 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-title scene-desc">
        <title id="scene-title">鹈鹕的海边骑行</title>
        <desc id="scene-desc">白色鹈鹕踩着自行车脚踏，车轮同步转动，围巾迎风飘动。海浪、云朵和路边植物缓缓向后移动。</desc>
        <defs>
          <clipPath id="landscape-clip"><rect x="47" y="46" width="1106" height="610" rx="265"/></clipPath>
          <pattern id="sea-lines" width="280" height="108" patternUnits="userSpaceOnUse">
            <path d="M16 17h62m-24 40h104m44-25h50M170 85h52M0 93h24" fill="none" stroke="#f1f5dd" stroke-width="3" stroke-linecap="round" opacity=".62"/>
          </pattern>
          <pattern id="road-marks" width="285" height="110" patternUnits="userSpaceOnUse">
            <path d="M20 38h52m105 29h88M103 98h18" stroke="#b8bca1" stroke-width="3" stroke-linecap="round"/>
          </pattern>
          <g id="cloud" fill="#fffdf3">

          </g>
          <g id="plant" fill="none" stroke="#688476" stroke-width="4" stroke-linecap="round">
            <path d="M0 0c3-21 5-37 0-55M0-15c-16-1-23-10-25-23C-9-37-2-27 0-15Zm2-11c15-1 22-11 24-24C10-46 4-38 2-26Z" fill="#829b7a"/>
          </g>
          <g id="wheel-spokes" stroke="#4f7370" stroke-width="1.6" opacity=".7">
            <path d="M-89 0H89M0-89V89M-63-63 63 63M-63 63 63-63M-82-34 82 34M-34-82 34 82M-82 34 82-34M-34 82 34-82"/>
            <path d="M32-74 43-69" stroke="#e99b5c" stroke-width="5" stroke-linecap="round"/>
          </g>
        </defs>

        <!-- The background moves at several speeds to give the ride depth. -->
        <g clip-path="url(#landscape-clip)">
          <path fill="#dfebdf" d="M0 0h1200v730H0Z"/>
          <circle cx="899" cy="162" r="66" fill="#f3c471"/>
          <circle cx="899" cy="162" r="79" fill="none" stroke="#f3c471" stroke-width="1" opacity=".35"/>
          <g id="clouds" opacity=".9"><g id="cloud-tile"><use href="#cloud" x="150" y="143"/><use href="#cloud" x="759" y="80" transform="scale(.8)"/><use href="#cloud" x="1070" y="236"/></g><use href="#cloud-tile" x="1400"/></g>
          <path d="M0 361c131-24 167-72 288-53 123 19 140 53 253 45 165-11 218-52 364-25s218 15 295-3v180H0Z" fill="#b6d0c5"/>

            <path d="M-25 6h60l-12 10h-36Z" fill="#5b8782"/>

          <path d="M0 553c213-21 293 16 505 0s361-11 695 7" fill="none" stroke="#eef0d5" stroke-width="7"/>
          <path d="M0 596h1200v134H0Z" fill="#e9e5cc"/>
          <path d="M0 604h1200v126H0Z" fill="url(#road-marks)" id="road"/>
          <g id="plants-back"><g id="back-plant-tile"><use href="#plant" x="150" y="591"/><use href="#plant" x="1007" y="585"/></g><use href="#back-plant-tile" x="1400"/></g>

        <ellipse id="shadow" cx="588" cy="654" rx="249" ry="10" fill="#61786c" opacity=".12"/>
        <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">

            <circle r="87" fill="none" stroke="#f4efdb" stroke-width="3"/>

          </g>

          <path d="M331 520a94 94 0 0 1 177-5M673 515a95 95 0 0 1 174 0" fill="none" stroke="#e9a15a" stroke-width="7"/>
          <path d="M420 550 515 431 565 548 420 550M515 431 711 435 565 548M697 396l63 154" fill="none" stroke="#2e6664" stroke-width="13"/>
          <path d="M515 431l196 4M420 550l95-119M711 435l49 115" fill="none" stroke="#80a695" stroke-width="3"/>
          <path d="m514 429-8-27" fill="none" stroke="#476761" stroke-width="9"/>
          <path d="M475 400q30-8 65-1l5 10q-39 8-74 0Z" fill="#294e50"/>
          <path d="m698 398-6-26q-3-14 10-15h33q16 0 16 14t-21 13" fill="none" stroke="#456561" stroke-width="8"/>
          <path d="M717 357h22" stroke="#bd7952" stroke-width="11"/>
          <path d="M737 387q32 41 19 107" fill="none" stroke="#53716a" stroke-width="2"/>
          <circle cx="705" cy="351" r="8" fill="#e8b85f" stroke="#496961" stroke-width="2"/>
          <path d="M420 540 561 523a25 25 0 1 1 0 50L420 560a10 10 0 0 1 0-20Z" fill="#b6c6ab" stroke="#4a7267" stroke-width="2.5"/>
          <circle cx="565" cy="548" r="24" fill="#e0dfbd" stroke="#4a7267" stroke-width="4"/>
          <g id="chainring" transform="rotate(0 565 548)" fill="none" stroke="#7b9480" stroke-width="2"><path d="M550 548h30m-15-15v30"/><circle cx="565" cy="548" r="17"/></g>
          <path id="near-crank" d="M565 548 603 548" stroke="#294e50" stroke-width="8"/>
          <circle cx="565" cy="548" r="6" fill="#294e50"/>

          <g id="rider">
            <!-- Long tail feathers, an ample body, and the pelican's curved neck. -->
            <path d="M439 354q-42 8-84-13 14 39 64 65l33-20Z" fill="#d7dfd3" stroke="#345a59" stroke-width="3.5"/>
            <path d="m405 375-32-19m42 10-27-18" fill="none" stroke="#9cad9f" stroke-width="2"/>
            <path d="M431 346c24-29 70-34 111-17 31 13 50 11 54-10 3-18-16-35-11-69 3-24 19-45 46-51 30-7 61 5 66 31 4 20-9 36-29 44-26 11-17 35-15 58 6 52-21 93-71 109-51 16-117 6-147-28-20-22-24-46-4-67Z" fill="#fffdf1" stroke="#345a59" stroke-width="4"/>
            <path d="M445 399c38 31 116 26 151-4 31-27 38-57 29-92 18 16 20 32 18 52-4 41-32 71-65 80-58 18-113 0-133-36Z" fill="#dfe5d5"/>
            <path d="M600 264q-4 29 17 45" fill="none" stroke="#d0dacc" stroke-width="6"/>
            <!-- Wind-blown orange scarf, behind the reaching wing. -->
            <path id="scarf-tail" d="M610 318C572 310 556 280 516 299L529 317 512 330C552 316 576 348 614 335Z" fill="#e78150" stroke="#ac6545" stroke-width="2.5"/>
            <path id="scarf-seam" d="M529 306q39-9 75 22" fill="none" stroke="#f6b279" stroke-width="3"/>
            <path d="M597 309q21 16 46 5l4 16q-23 14-48-3Z" fill="#e78150" stroke="#ac6545" stroke-width="2"/>
            <path d="m612 320 8 12 12-10" fill="none" stroke="#f6b279" stroke-width="3"/>
            <!-- The lower pouch and very long bill make the silhouette unmistakable. -->
            <path d="M674 240q70-3 169 15c-24 19-51 45-95 45-45-1-69-21-74-60Z" fill="#edb65f" stroke="#8b7045" stroke-width="3"/>
            <path d="M684 255q41 40 107 19-29 30-62 17-31-10-45-36Z" fill="#f2cd82"/>
            <path d="M674 231q62 2 173 22 9 2 8 7-4 6-15 3L675 250Z" fill="#ed9251" stroke="#8b7045" stroke-width="3"/>
            <path d="m686 240 135 15" fill="none" stroke="#ffd28b" stroke-width="2.5"/>
            <path d="M673 249q-8 10-18 9" fill="none" stroke="#345a59" stroke-width="2.5"/>
            <!-- Cycling cap and a blink animated around the eye's own center. -->
            <path d="M610 207q-1-39 35-39 33 0 41 35Z" fill="#417c78" stroke="#345a59" stroke-width="3"/>
            <path d="M640 171q18 12 19 31" fill="none" stroke="#a4c4a5" stroke-width="9"/>
            <path d="M604 206q41-11 93-1 9 2 7 7l-27 3q-39-10-73-3Z" fill="#548c80" stroke="#345a59" stroke-width="3"/>
            <path d="m609 218-7 11" stroke="#345a59" stroke-width="3"/>
            <g id="eye"><ellipse cx="657" cy="231" rx="5.1" ry="6.2" fill="#294e50"/><circle cx="658.4" cy="229.3" r="1.4" fill="#fffdf1"/></g>
            <path d="M649 220q7-5 13-1" fill="none" stroke="#345a59" stroke-width="2.3"/>
            <ellipse cx="643" cy="250" rx="9" ry="5" fill="#e9b49a" opacity=".7"/>
            <!-- The wing reaches all the way to the handlebars. -->
            <path d="M467 351c24-19 59-6 84 9 42 27 83 35 145 13l23-11q10-3 8 5l-9 9q12-4 10 2c-2 6-23 15-37 18-58 20-117 11-158-6-32-13-53-15-66-39Z" fill="#eaf0df" stroke="#345a59" stroke-width="3.5"/>
            <path d="M486 355q21 4 42 19m-45-8q17 3 34 16m31-7q54 29 107 17" fill="none" stroke="#b6c8b6" stroke-width="2.5"/>
          </g>
          <path id="near-leg" d="M532 422 591 479 603 548" fill="none" stroke="#b97f44" stroke-width="16"/>
          <path id="near-leg-light" d="M532 422 591 479 603 548" fill="none" stroke="#eab163" stroke-width="10"/>
          <g id="near-pedal"><path d="M-17 8h37" stroke="#294e50" stroke-width="7"/><path d="M-11 6v4m8-4v4m8-4v4m8-4v4" stroke="#94a68c" stroke-width="1.5"/></g>
          <path id="near-foot" d="M590 546q15-8 32 0l-1 6h-32Z" fill="#efb45f" stroke="#986f41" stroke-width="2.5"/>
        </g>

        <g clip-path="url(#landscape-clip)" aria-hidden="true">
          <g id="plants-front"><g id="front-plant-tile"><g transform="translate(1090 675) scale(1.2)"><use href="#plant"/></g><use href="#plant" x="98" y="651"/></g><use href="#front-plant-tile" x="1400"/></g>
        </g>
        <g fill="none" stroke="#7a9a8c" stroke-width="2.5" stroke-linecap="round" opacity=".65" aria-hidden="true" id="breeze">
          <path d="M307 337h-43m30 21h-65m87 20h-26"/>
        </g>
        <g transform="translate(1068 527) rotate(-11)" fill="#476e65" aria-hidden="true">
          <path d="M0-26V0m-13-13h26m-22-9 18 18m-18 0 18-18" stroke="#789688" stroke-width="1.5"/>
        </g>
      </svg>
    </figure>

    <div class="caption"><p>风刚刚好，慢慢骑就好。</p><span>Life is better at pelican pace.</span></div>
    <div class="controls" aria-label="动画控制">
      <button class="play-button" id="play-toggle" type="button" aria-label="暂停动画">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-icon" d="M4 3v10M12 3v10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span id="play-label">暂停骑行</span>
      </button>
      <div class="speed-control"><label for="speed">骑行速度</label><input id="speed" type="range" min="0.5" max="2" value="1" step="0.25" aria-valuetext="1 倍速"><output id="speed-value" for="speed">1×</output></div>
      <div class="status" id="status"><span class="status-dot"></span><span id="status-label">海风骑行中</span></div>
      <span class="key-hint">空格键 · 播放 / 暂停</span>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const elements = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'chainring', 'rider', 'far-leg', 'far-foot',
        'near-leg', 'near-leg-light', 'near-foot', 'near-crank', 'far-crank',
        'near-pedal', 'far-pedal', 'scarf-tail', 'scarf-seam', 'eye', 'shadow',
        'clouds', 'waves', 'road', 'plants-back', 'plants-front', 'sailboat', 'gulls', 'breeze'
      ].map(id => [id, $(id)]));
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let previousTime = null;
      let frameId = 0;
      const set = (id, attribute, value) => elements[id].setAttribute(attribute, value);

      // Two fixed-length segments keep the foot on its pedal throughout a revolution.
      function legPath(hip, foot) {
        const upper = 82, lower = 96;
        const dx = foot.x - hip.x, dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hip.x + along * dx / distance + offset * dy / distance;
        const kneeY = hip.y + along * dy / distance - offset * dx / distance;
        return `M${hip.x} ${hip.y} L${kneeX} ${kneeY} L${foot.x} ${foot.y}`;
      }

      function render(time) {
        const phase = time * 2.9;
        const angle = phase + .48;
        const travel = phase * 103.5 * 1.6; // Tire radius includes half of its 13px stroke.
        const degrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 1.8;
        const hip = { x: 532, y: 423 + bob };
        const foot = { x: 565 + Math.cos(angle) * 38, y: 548 + Math.sin(angle) * 38 };
        const farFoot = { x: 565 - Math.cos(angle) * 38, y: 548 - Math.sin(angle) * 38 };
        set('rear-wheel', 'transform', `rotate(${degrees * 1.6})`);
        set('front-wheel', 'transform', `rotate(${degrees * 1.6})`);
        set('chainring', 'transform', `rotate(${degrees} 565 548)`);
        set('rider', 'transform', `translate(0 ${bob})`);
        set('near-leg', 'd', legPath(hip, foot));
        set('near-leg-light', 'd', legPath(hip, foot));
        set('far-leg', 'd', legPath({ x: 524, y: 421 + bob }, farFoot));
        set('near-crank', 'd', `M565 548L${foot.x} ${foot.y}`);
        set('far-crank', 'd', `M565 548L${farFoot.x} ${farFoot.y}`);
        set('near-pedal', 'transform', `translate(${foot.x} ${foot.y})`);
        set('far-pedal', 'transform', `translate(${farFoot.x} ${farFoot.y})`);
        set('near-foot', 'd', `M${foot.x - 12} ${foot.y - 3}q13-9 29-1l7 6q-12 5-34 2Z`);
        set('far-foot', 'd', `M${farFoot.x - 10} ${farFoot.y}h29`);
        const flutter = Math.sin(time * 6) * 7;
        set('scarf-tail', 'd', `M610 318C572 ${310 + flutter} 556 ${280 + flutter} 516 ${299 + flutter}L529 ${317 + flutter} 512 ${330 + flutter}C552 ${316 + flutter} 576 ${348 + flutter} 614 335Z`);
        set('scarf-seam', 'd', `M529 ${306 + flutter}Q568 ${299 + flutter} 604 328`);
        const blinkTime = time % 5.7;
        const eyeOpen = blinkTime > 4.9 && blinkTime < 5.12 ? .12 : 1;
        set('eye', 'transform', `translate(657 231) scale(1 ${eyeOpen}) translate(-657 -231)`);
        set('shadow', 'rx', 249 + bob * 1.2);
        set('clouds', 'transform', `translate(${-((time * 8) % 1400)} 0)`);
        $('sea-lines').setAttribute('patternTransform', `translate(${-(travel * .13 % 280)} 0)`);
        $('road-marks').setAttribute('patternTransform', `translate(${-(travel % 285)} 0)`);
        set('plants-back', 'transform', `translate(${-(travel * .8 % 1400)} 0)`);
        set('plants-front', 'transform', `translate(${-(travel % 1400)} 0)`);
        set('sailboat', 'transform', `translate(${1150 - ((time * 12 + 172) % 1450)} ${391 + Math.sin(time * 1.6) * 2})`);
        set('gulls', 'transform', `translate(${Math.sin(time * .4) * 15} ${Math.sin(time * 1.2) * 4})`);
        set('breeze', 'opacity', .4 + Math.sin(time * 4) * .15);
      }

      function tick(timestamp) {
        if (!playing || document.hidden) { frameId = 0; return; }
        if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .05) * speed;
        previousTime = timestamp;
        render(elapsed);
        frameId = requestAnimationFrame(tick);
      }
      function schedule() {
        previousTime = null;
        if (playing && !document.hidden && !frameId) frameId = requestAnimationFrame(tick);
      }
      function updatePlayback() {
        $('play-toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        $('play-label').textContent = playing ? '暂停骑行' : '继续骑行';
        $('play-icon').setAttribute('d', playing ? 'M4 3v10M12 3v10' : 'M4 2 13 8 4 14Z');
        $('play-icon').setAttribute('fill', playing ? 'none' : 'currentColor');
        $('play-icon').setAttribute('stroke-width', playing ? '3' : '1');
        $('status-label').textContent = playing ? '海风骑行中' : '停下来，看看海';
        $('status').classList.toggle('paused', !playing);
        if (!playing) { cancelAnimationFrame(frameId); frameId = 0; }
        schedule();
      }
      function togglePlayback() { playing = !playing; updatePlayback(); }
      $('play-toggle').addEventListener('click', togglePlayback);
      $('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        $('speed-value').textContent = `${speed}×`;
        event.target.setAttribute('aria-valuetext', `${speed} 倍速`);
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest('button, input, textarea, select, a, [contenteditable]')) return;
        event.preventDefault();
        togglePlayback();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { cancelAnimationFrame(frameId); frameId = 0; previousTime = null; }
        else schedule();
      });
      reducedMotion.addEventListener('change', event => {
        if (event.matches) { playing = false; updatePlayback(); }
      });
      render(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
