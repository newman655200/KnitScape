<!doctype html><meta charset="utf-8"><title>KnitScape Geometry Audit Replay</title>
<style>body{margin:0;width:900px;background:#41464c;color:white;font:14px monospace}#status{height:72px;white-space:pre-wrap;overflow:hidden;padding:8px;box-sizing:border-box}#replay{position:relative;width:900px;height:900px}canvas{position:absolute;top:0;left:0}.top{z-index:5}.mid{z-index:2}.bottom{z-index:0;filter:brightness(.7)}</style>
<div id="status">Loading diagnostic replay</div><div id="replay"><canvas id="back" class="bottom"></canvas><canvas id="mid" class="mid"></canvas><canvas id="front" class="top"></canvas></div>
<script type="module">
import {readProjectPackage} from '/src/actions/projectPackage.js';
import {yarnAssetRegistry} from '/src/yarnTexture/yarnAssetRegistry.js';
import {createSingleJerseyExecutionInput} from '/src/components/singleJerseyExecutionInput.js';
import {simulate} from '/src/simulation/yarnSimulation.js';
import {Bimp} from '/src/lib/Bimp.js';
import {prepareYarnTextureImages,resolveFeedYarnPlies} from '/src/simulation/yarnTextureBrush.js';
import {getWebglYarnRenderer} from '/src/simulation/yarnUvWebglRenderer.js';
const params=new URLSearchParams(location.search),name=params.get('case')||'23+8',mode=params.get('mode')||'solid';
try {
  const opened=await readProjectPackage(await (await fetch('/reports/sop-001/SOP-001-N6W6040-main-yarn-with-cam.knitscape')).blob());
  yarnAssetRegistry.replaceWith(opened.registry);
  const p=opened.project,id=p.singleJerseyCamProgram.feeds[0].yarns[0].yarnId;
  const lengths=name.split('+').map(Number);
  p.yarnLibrary.push({id:'audit-second',name:'20D LOW diagnostic',category:'OTHER'});
  p.singleJerseyCamProgram.feeds.forEach(f=>f.yarns=lengths.map((n,i)=>({yarnId:i?'audit-second':id,yarnLengthCmPer100Needles:n,tensionCN:null,placement:'parallel'})));
  if(mode==='quality') await prepareYarnTextureImages([...resolveFeedYarnPlies(p.singleJerseyCamProgram.feeds,p.yarnLibrary,p.yarnPlies[0]).values()].flat());
  const input=createSingleJerseyExecutionInput(p.singleJerseyCamProgram,p.needleArrangement,p.width,p.height);
  const r=simulate(input,Bimp.fromJSON(p.yarnSequence),p.yarnPalette,1,p.yarnPlies,{machineGauge:p.machineGauge,texturePerformanceMode:mode,
    target:{containerId:'replay',canvasIDs:['back','mid','front']},feeds:p.singleJerseyCamProgram.feeds,yarnLibrary:p.yarnLibrary});
  const webgl=mode==='quality'?['back','mid','front'].filter(id=>getWebglYarnRenderer(document.getElementById(id))).length:0;
  document.querySelector('#status').textContent=`READY | ${name} | ${mode} | ${r.previewValidity} | 900x900 CSS px | DPR ${devicePixelRatio} | WebGL ${webgl}/3\n`+
  r.yarnLengthSolverResults.map(s=>`${s.feedIndex+1}/${s.yarnIndex+1}:${s.status}`).join(' ');
} catch(e) {document.querySelector('#status').textContent='ERROR '+e.stack;}
</script>
